<script>
// Theme toggle: default to system preference, remember explicit choice
(function(){
  const root = document.documentElement;
  const saved = localStorage.getItem('theme');
  if(saved){ root.setAttribute('data-theme', saved); }
  window.toggleTheme = function(){
    const systemDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
    const current = root.getAttribute('data-theme') || (systemDark ? 'dark' : 'light');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    updateIcon(next);
  };
  function updateIcon(theme){
    const isDark = theme === 'dark' || (theme == null && window.matchMedia('(prefers-color-scheme:dark)').matches);
    const icon = document.querySelector('#theme-toggle i');
    if(icon){ icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon'; }
  }
  updateIcon(root.getAttribute('data-theme'));
})();
</script>
